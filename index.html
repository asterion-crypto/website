<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8e9da">
    <meta name="description" content="Something beautiful is coming.">
    <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
    <title>Asterion</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, 'Times New Roman', serif;
        background: #e8e9da;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      main {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
      }

      img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% center;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        padding: clamp(2rem, 12vh, 7rem) 1.5rem 0;
        color: #203332;
        font-size: clamp(1.6rem, 3.2vw, 3.4rem);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.15;
        text-align: center;
        text-shadow: 0 1px 18px rgba(245, 245, 224, 0.8);
      }

      nav {
        position: absolute;
        z-index: 1;
        right: 0;
        bottom: clamp(1.5rem, 5vh, 3rem);
        left: 0;
        display: flex;
        justify-content: center;
        gap: 0.75rem;
      }

      nav a {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        place-items: center;
        color: #203332;
        opacity: 0.68;
        transition: opacity 150ms ease;
      }

      nav a:hover { opacity: 1; }
      nav a:focus-visible { outline: 2px solid #203332; outline-offset: 3px; }
      nav svg { display: block; width: 1.1rem; height: 1.1rem; fill: currentColor; }

      @media (max-width: 600px) {
        img { object-position: 64% center; }
        h1 { padding-top: 9vh; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="landscape.jpeg" alt="Dreamlike pastel road with a solitary tree and a small yellow car">
      <h1>something beautiful is coming</h1>
      <nav aria-label="Social media">
        <a href="https://x.com/AsterionCrypto" aria-label="Asterion on X" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.64 7.584H.472l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.933Zm-1.29 19.49h2.039L6.486 3.24H4.297L17.61 20.643Z"/></svg>
        </a>
        <a href="https://www.linkedin.com/company/asterioncrypto/" aria-label="Asterion on LinkedIn" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.6 0 4.267 2.37 4.267 5.455v6.286ZM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124ZM7.119 20.452H3.555V9h3.564v11.452ZM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0Z"/></svg>
        </a>
      </nav>
    </main>
  </body>
</html>
