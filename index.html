<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8e9da">
    <meta name="description" content="Something beautiful is coming.">
    <title>Asterion</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, 'Times New Roman', serif;
        background: #e8e9da;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      main {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
      }

      img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% center;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        padding: clamp(2rem, 12vh, 7rem) 1.5rem 0;
        color: #203332;
        font-size: clamp(1.6rem, 3.2vw, 3.4rem);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.15;
        text-align: center;
        text-shadow: 0 1px 18px rgba(245, 245, 224, 0.8);
      }

      @media (max-width: 600px) {
        img { object-position: 64% center; }
        h1 { padding-top: 9vh; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="landscape.jpeg" alt="Dreamlike pastel road with a solitary tree and a small yellow car">
      <h1>something beautiful is coming</h1>
    </main>
  </body>
</html>
